[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-walkforward-trader"
version = "0.1.0"
description = "Compact Ridge and momentum signal deployment with guarded Kite execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "kiteconnect>=5,<6",
]

[project.optional-dependencies]
research = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=12"]

[project.scripts]
trading-rebalance = "trading_strategy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
